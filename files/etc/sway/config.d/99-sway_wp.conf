# sway_wp.py: wallpaper that explains this session from its own configuration.
# Runs on every sway start and reload (Mod4+Shift+c), the event that applies
# changes to every value it shows. It sets the wallpaper itself via sway IPC.
# What it shows: /etc/sway_wp/sway_wp-elements.config
#   (per user: ~/.config/sway_wp/sway_wp-elements.config)
exec_always /usr/bin/sway_wp.py
